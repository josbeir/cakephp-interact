name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, mbstring, pdo_sqlite, dom
          coverage: xdebug
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: composer check
      - run: composer test-coverage
        env:
          XDEBUG_MODE: coverage
      - name: Upload PHP coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: build/clover.xml
          flags: php
          disable_search: true
          use_oidc: true
          fail_ci_if_error: false
      - uses: actions/upload-artifact@v4
        with:
          name: php-coverage
          path: build/clover.xml

  browser:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, mbstring, pdo_sqlite, dom
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: npm run check
      - run: npm run test:coverage
      - name: Upload TypeScript coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: build/coverage-js/lcov.info
          flags: typescript
          disable_search: true
          use_oidc: true
          fail_ci_if_error: false
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - run: npm run docs:build
      - run: npm run package:composer
      - run: npm pack --dry-run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            test-results/
            build/coverage-js/
            build/releases/
