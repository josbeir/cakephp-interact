name: Quality

on:
  push:
    branches: [main, cake6]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP (PHPUnit ${{ matrix.phpunit }}, ${{ matrix.dependencies }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dependencies: locked, phpunit: '13', constraint: '^13.0' }
          - { dependencies: lowest, phpunit: '12', constraint: '^12.5' }
          - { dependencies: latest, phpunit: '12', constraint: '^12.5' }
          - { dependencies: lowest, phpunit: '13', constraint: '^13.0' }
          - { dependencies: latest, phpunit: '13', constraint: '^13.0' }
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, mbstring, pdo_sqlite, dom
          coverage: xdebug
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - name: Select PHPUnit major
        if: matrix.dependencies != 'locked'
        run: composer require --dev --no-update "phpunit/phpunit:${{ matrix.constraint }}"
      - name: Resolve minimum framework dependencies
        if: matrix.dependencies == 'lowest'
        run: composer update cakephp/cakephp josbeir/cakephp-mercure phpunit/phpunit --with-dependencies --prefer-lowest --prefer-stable --no-interaction
      - name: Resolve latest framework dependencies
        if: matrix.dependencies == 'latest'
        run: composer update cakephp/cakephp josbeir/cakephp-mercure phpunit/phpunit --with-dependencies --no-interaction
      - run: composer validate --strict
      - run: composer check
      - run: composer test-coverage
        env:
          XDEBUG_MODE: coverage
      - name: Upload PHP coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: build/clover.xml
          flags: php
          disable_search: true
          use_oidc: true
          fail_ci_if_error: false
      - uses: actions/upload-artifact@v4
        with:
          name: php-coverage-${{ matrix.dependencies }}-${{ matrix.phpunit }}
          path: build/clover.xml

  browser:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, mbstring, pdo_sqlite, dom
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: npm run check
      - run: npm run test:coverage
      - name: Upload TypeScript coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: build/coverage-js/lcov.info
          flags: typescript
          disable_search: true
          use_oidc: true
          fail_ci_if_error: false
      - run: npm run build
      - name: Verify committed Composer browser assets
        run: |
          git ls-files --error-unmatch webroot/js/runtime.js webroot/js/THIRD-PARTY-LICENSES.txt
          git diff --exit-code HEAD -- webroot/js/runtime.js webroot/js/THIRD-PARTY-LICENSES.txt
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - run: npm run docs:build
      - run: npm run package:composer
      - run: npm pack --dry-run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            test-results/
            build/coverage-js/
            build/releases/
