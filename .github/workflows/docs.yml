name: Documentation

on:
  push:
    branches: [main, cake6]
    paths:
      - 'docs/**'
      - 'tests/Fixture/Documentation/**'
      - 'scripts/check-docs.mjs'
      - 'README.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
      - '.github/workflows/docs-deploy.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'tests/Fixture/Documentation/**'
      - 'scripts/check-docs.mjs'
      - 'README.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
      - '.github/workflows/docs-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run docs:build
